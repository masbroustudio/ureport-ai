[project]
name = "ureport-api"
version = "0.1.0"
description = "uReport AI Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "alembic",
    "litellm",
    "redis",
    "celery",
    "boto3",
    "python-multipart",
    "qdrant-client",
    "httpx",
    "python-jose[cryptography]",
    "argon2-cffi",
    "asyncpg",
    "email-validator",
    "pandas",
    "openpyxl",
    "plotly",
    "pymupdf",
    "python-docx",
    "fastembed",
    "tiktoken",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
